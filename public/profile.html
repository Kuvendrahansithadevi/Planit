<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planit Profile</title>
    <link rel="stylesheet" href="profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <img src="Plogo.png" alt="logo" class="logo-img">
        <span class="logo-text">Planit</span>
    </div>
    <nav class="nav-links">
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="#" class="nav-item">About</a>
        <a href="#" class="nav-item">Services</a>
        <a href="profile.html" class="nav-item active">Profile</a>
    </nav>
</header>

<div class="container">
    <div class="profile-center">
        <img src="profile.jpeg" class="avatar">
        <h2 class="name" id="userName">Loading...</h2>
        <div class="info">
            <p><strong>Email</strong> : <span id="userEmail">loading...</span></p>
        </div>
        <button id="openEditModal">Edit Profile</button>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3>Tasks Completed</h3>
            <p id="countCompleted">0 Tasks</p>
        </div>
        <div class="stat-card">
            <h3>Productivity</h3>
            <p id="productivityPercent">0%</p>
        </div>
        <div class="stat-card">
            <h3>Goals Remaining</h3>
            <p id="countRemaining">0 Tasks</p>
        </div>
    </div>
</div>

<div id="editProfileModal" class="modal">
    <div class="modal-content">
        <h3>Edit Profile</h3>
        <input type="text" id="inputName" placeholder="Full Name">
        <div class="btn-group">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="save-btn" id="saveProfile">Save Changes</button>
        </div>
    </div>
</div>

<script src="profile.js"></script>
</body>
</html>
